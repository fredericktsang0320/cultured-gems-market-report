<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彩寶公開資料工作台</title><style>body{font:16px/1.7 -apple-system,BlinkMacSystemFont,'PingFang HK',sans-serif;color:#222;background:#faf8f4;margin:0}main{max-width:1200px;margin:40px auto;padding:0 24px}h1{font-family:serif;font-size:36px}button,input{font:inherit}button{padding:8px 18px;cursor:pointer}table{border-collapse:collapse;width:100%;background:white;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #dedbd3;vertical-align:top}small{color:#555}a{color:#794b27}#wrap{overflow:auto}#status{padding:16px 0}select{padding:8px;font:inherit}</style><main><h1>彩寶公開資料工作台</h1><p>本機證據庫：保留原文、畫面、價格及「已售」標示。採集由 Computer Use 執行；此工具負責解析、存檔及時序比較。</p><p><input type="file" id="file" accept=".json,application/json" aria-label="匯入 snapshots.json"> <select id="filter" aria-label="篩選類別"><option value="">全部紀錄</option><option value="鑽石／排除">鑽石／排除</option><option value="成品／待核材質">成品</option><option value="裸石">裸石</option><option value="釔鋁榴石／仿寶石">仿寶石</option></select></p><div id="status">讀取本機 snapshots.json；直接開啟檔案時可用上方匯入。</div><div id="wrap"><table><thead><tr><th>商品／平台</th><th>價格 CNY</th><th>已售原標示</th><th>類別</th><th>採集時間</th><th>原文與畫面</th></tr></thead><tbody id="rows"></tbody></table></div><h2>期間比較</h2><p id="period">需要同一商品、相同規格及跨期快照。</p><p><small>本期 11 筆觀察，含同一戒指於列表及詳情頁的重複觀察。此頁不以筆數充當商品數。價格是當時顯示，券後／關注價可能附條件。</small></p></main><script>
let data={observations:[],comparison:[]};const $=s=>document.getElementById(s);function el(t,v){let x=document.createElement(t);x.textContent=v;return x}function link(t,u){let x=el('a',t);if(/^(https?:\/\/|evidence\/)/.test(u)){x.href=u;x.target='_blank';x.rel='noopener'}return x}function render(){let rs=data.observations.filter(r=>!$('filter').value||r.category===$('filter').value);$('rows').replaceChildren();for(let r of rs){let tr=document.createElement('tr');for(let v of [r.name+' · '+r.platform,r.price_cny,r.raw_sales,r.category,r.captured_at])tr.append(el('td',v));let td=el('td','');if(r.original_url){td.append(link('商品原文',r.original_url),' · ')}td.append(link('截圖',r.evidence),' · ',link('原文與畫面',r.raw_text.replace(/original\.txt$/, 'original.html')));tr.append(td);$('rows').append(tr)}$('status').textContent=`顯示 ${rs.length} 筆觀察；${data.comparison.length} 組跨期比較。`;$('period').textContent=data.comparison.length?JSON.stringify(data.comparison):'目前只有同日基線，週／月新增銷量等待跨期快照。'}$('file').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.observations))throw Error('格式需要 observations 陣列');render()}catch(x){$('status').textContent='匯入失敗：'+x.message}};$('filter').onchange=render;fetch('snapshots.json').then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>{});
</script></html>
